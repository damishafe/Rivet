[project]
name = "rivet"
version = "0.1.0"
description = "Verified multimodal ad creation on one AMD Radeon GPU"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlmodel>=0.0.22",
    "pillow>=11.0",
    "typer>=0.15",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
gpu = [
    "torch",
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
]

[project.scripts]
rivet = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rivet", "cli", "services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rivet", "cli", "services"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
